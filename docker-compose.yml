# Entorno de desarrollo de Nodus: el mismo Odoo 19 de producción (imagen de Odoo-basico) con el
# Taller y los módulos de este repo montados en caliente (editas aquí y actualizas el módulo).
#
# Necesita estas carpetas HERMANAS de este repo (ver LEEME.md):
#   ../Odoo-basico    git@github.com:Rese4248/Odoo-basico.git
#   ../Nodus_Taller   git@github.com:Rese4248/Nodus_Taller.git
#
# Uso:  docker compose up -d --build      → http://localhost:8079
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - nodus-db:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    build:
      context: ../Odoo-basico
      dockerfile: docker/Dockerfile
      target: prod
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8079:8069"
    volumes:
      - ./:/mnt/nodus
      - ../Nodus_Taller:/mnt/taller
      - ./docker/odoo.conf:/etc/odoo/odoo.conf
      - nodus-datos:/var/lib/odoo
    # --dev=xml: las vistas y plantillas QWeb se leen del disco sin actualizar el módulo
    command: ["--dev=xml"]
    restart: unless-stopped

volumes:
  nodus-db:
  nodus-datos:
